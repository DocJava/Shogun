<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <title>Shogun</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

</head>

<body>

   <!-- Questo è il container della storia Ink -->
   <div class="outerContainer">
        <h3 class="written-in-ink"><a href="https://www.inklestudios.com/ink">SCRITTO CON INK</a></h3>

        <div id="controls" class="buttons">
          <a id="char" title="Character">pers.</a> <!-- nuovo pulsante: personaggio -->
          <a id="inv" title="Inventory">inv.</a> <!-- nuovo pulsante: inventario -->
          <a id="rewind" title="Restart story from beginning">riparti</a>
          <a id="save" title="Save progress">salva</a>
          <a id="reload" title="Reload from save point">carica</a>
          <a id="font-switch" title="Change font weight">font</a> <!-- nuovo pulsante: font -->
          <a id="audio-switch" title="Turn on/off audio">audio</a> <!-- nuovo pulsante: audio -->
          <a id="theme-switch" title="Switch theme">tema</a>
        </div>

        <div id="story" class="container">
            <div class="header">
                <h1>Shogun</h1>
                <h2 class="byline"></h2>
            </div>
        </div>
    </div>

    <!-- Questo è il container per il dado -->
    <div id="dice-popup">
        <div id="cubeWrapper">
            <div id="cube" class="cube">
                <div class="face front"></div>
                <div class="face back"></div>
                <div class="face right"></div>
                <div class="face left"></div>
                <div class="face top"></div>
                <div class="face bottom"></div>
            </div>
        </div>
    </div>

    <!-- Questo è il container per tutte le statistiche di gioco -->
    <div id ="stats-popup">
    
        <!-- Questo è il container per il tempo nel gioco -->
        <div id="edo-clock-popup">
            <div id="edo-clock-panel">
                <div id="edo-clock">
                    <div id="edo-clock-day">
                        <img id="edo-sky-dawn" src="images/sky-dawn.jpg" class="edo-sky">
                        <img id="edo-sky-day" src="images/sky-day.jpg" class="edo-sky">
                        <img id="edo-sky-dusk" src="images/sky-dusk.jpg" class="edo-sky">
                        <img id="edo-sky-night" src="images/sky-night.jpg" class="edo-sky">
                    </div>
                    <div id="edo-clock-night"></div>
                    <div id="edo-orbit-sun">
                        <img id="edo-sun" src="images/sun.png">
                    </div>
                    <div id="edo-orbit-moon">
                        <img id="edo-moon" src="images/moon.png">
                    </div>
                </div>
            </div>
        </div>

        <!-- Questo è il container per le statistiche personaggio -->
        <div id="stats-panel">      
            <h2 id="stats-title">Statistiche Bushido</h2>       
            <div id="stats-grid">
                <div class="stat-label"><img src="images/Gi.png" width="50px" height="50px"></div><div class="stat-name">Gi</div><div class="stat-value" id="UI_Gi">0</div>
                <div class="stat-label"><img src="images/Yu.png" width="50px" height="50px"></div><div class="stat-name">Yu</div><div class="stat-value" id="UI_Yu">0</div>
                <div class="stat-label"><img src="images/Jin.png" width="50px" height="50px"></div><div class="stat-name">Jin</div><div class="stat-value" id="UI_Jin">0</div>
                <div class="stat-label"><img src="images/Rei.png" width="50px" height="50px"></div><div class="stat-name">Rei</div><div class="stat-value" id="UI_Rei">0</div>
                <div class="stat-label"><img src="images/Makoto.png" width="50px" height="50px"></div><div class="stat-name">Makoto</div><div class="stat-value" id="UI_Makoto">0</div>
                <div class="stat-label"><img src="images/Meiyo.png" width="50px" height="50px"></div><div class="stat-name">Meiyo</div><div class="stat-value" id="UI_Meiyo">0</div>
                <div class="stat-label"><img src="images/Chugi.png" width="50px" height="50px"></div><div class="stat-name">Chugi</div><div class="stat-value" id="UI_Chugi">0</div>
                <div class="stat-label"><img src="images/Htp.png" width="50px" height="50px"></div><div class="stat-name">Salute</div><div class="stat-value" id="UI_Htp">0</div>
                <div class="stat-label"><img src="images/Ki.png" width="50px" height="50px"></div><div class="stat-name">Ki</div><div class="stat-value" id="UI_Ki">0</div>
                <div class="stat-label"><img src="images/Dmg.png" width="50px" height="50px"></div><div class="stat-name">Danno</div><div class="stat-value" id="UI_Dmg">0</div>
                <div class="stat-label"><img src="images/Vel.png" width="50px" height="50px"></div><div class="stat-name">Velocità</div><div class="stat-value" id="UI_Vel">0</div>
                <div class="stat-label"><img src="images/Pro.png" width="50px" height="50px"></div><div class="stat-name">Difesa</div><div class="stat-value" id="UI_Pro">0</div>
            </div>
        </div>

    </div>

    
	<!-- Questo è il container per l'inventario -->
    <div id="inv-popup">
       <div id="inv-panel">      
            <w id="inv-title">Inventario</w>      
            <w id="inventory"></w>       
        </div>
	</div>


    <script src="ink.js"></script>
    <script src="Shogun.js"></script>
    <script src="rolldice.js"></script>
    <script src="main.js"></script>
</body>
</html>
